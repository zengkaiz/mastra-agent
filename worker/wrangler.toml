name = "mastra-interview-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Vectorize 绑定
[[vectorize]]
binding = "VECTORIZE"
index_name = "frontend-assistant"

# 环境变量
[vars]
VECTORIZE_INDEX = "frontend-assistant"

# 注意：
# 1. OPENAI_API_KEY 需要通过以下命令设置：
#    wrangler secret put OPENAI_API_KEY
#    或使用环境变量：export OPENAI_API_KEY="sk-xxxx"
#
# 2. 创建 Vectorize 索引（首次部署前执行）：
#    wrangler vectorize create frontend-assistant \
#      --dimensions=1536 \
#      --metric=cosine \
#      --description="Frontend interview assistant knowledge base"
#
# 3. 查看 Vectorize 索引列表：
#    wrangler vectorize list
#
# 4. 删除 Vectorize 索引（如果需要）：
#    wrangler vectorize delete frontend-assistant

