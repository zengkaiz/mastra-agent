name = "mastra-interview-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# R2 存储绑定（可选 - 如果启用 R2，取消下面的注释）
# 使用前需要在 Cloudflare Dashboard 启用 R2，然后运行：
#   wrangler r2 bucket create interview-pdfs
[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "interview-pdfs"
preview_bucket_name = "interview-pdfs-preview"

# Vectorize 绑定
[[vectorize]]
binding = "VECTORIZE"
index_name = "frontend-assistant"

# AI Workers 绑定（用于生成 embeddings）
[ai]
binding = "AI"

# 环境变量
[vars]
VECTORIZE_INDEX = "frontend-assistant"

# Durable Objects 配置：用于异步处理 PDF 向量化（免费版可用）
[[durable_objects.bindings]]
name = "PDF_PROCESSOR"
class_name = "PDFProcessor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PDFProcessor"]


